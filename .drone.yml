kind: pipeline
name: default

workspace:
  path: /paperplane-blog

volumes:
  - name: webroot
    host:
      path: /root/container-config/www
  - name: pnpm-cache
    host:
      path: /root/container-cache/.pnpm-cache

trigger:
  branch:
    - main

steps:
  - name: build
    image: chiskat/baseline-node20:2026.1.14
    volumes:
      - name: pnpm-cache
        path: /paperplane-blog/.pnpm-store
    commands:
      - pnpm i
      - pnpm build
    environment:
      API_KEY:
        from_secret: API_KEY

  - name: deploy-upload-cdn
    image: plugins/s3
    settings:
      endpoint:
        from_secret: S3_ENDPOINT
      region:
        from_secret: S3_REGION
      bucket:
        from_secret: S3_BUCKET_NAME
      access_key:
        from_secret: S3_ACCESS_KEY_ID
      secret_key:
        from_secret: S3_SECRET_ACCESS_KEY
      source: ./public/**/*
      target: /paperplane-blog
      strip_prefix: public
      content_type:
        ".*ttf$": "font/ttf"
        ".*woff$": "font/woff"
        ".*woff2$": "font/woff2"
        ".*eot$": "application/vnd.ms-fontobject"

  - name: deploy
    image: alpine:3.20
    volumes:
      - name: webroot
        path: /webroot
    commands:
      - mkdir -p /webroot/paperplane-blog/
      - rm -rf /webroot/paperplane-blog/*
      - cp -rf ./public/* /webroot/paperplane-blog/
